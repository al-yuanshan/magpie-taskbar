name: build

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-2022
    strategy:
      matrix:
        arch: [x64, Win32]
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        shell: pwsh
        run: ./build.ps1 -Architecture ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: MagpieRoute-${{ matrix.arch }}
          path: dist/${{ matrix.arch }}/MagpieRoute.dll
